name: Feature request
description: Propose an improvement that does not change the shared protocol contract
title: "feat: "
labels: ["type: feature", "status: needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK or adapter
        - Validator
        - CLI
        - Documentation or examples
        - Developer experience
        - Not sure
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior and who benefits from it. Examples are encouraged.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Could this affect existing producers, consumers, manifests, scenes, or assets?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: If this changes the shared contract, I will use the Protocol change template instead.
          required: true
